# DEF-018 D1(a)：仓级 CI——本地 prepublishOnly 之外，拦截「不发布但合入」的 src→lib 漂移
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # F-A1-07：防空跑卡死（原缺失 · 2.2.0 W1 补）
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']  # 对齐 package.json engines: ^22.19.0 || >=24.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布溯源测需 git tag v<version>（test/release-tag-identity.test.ts）
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:lib
      - run: node bin/specgate.js pins check  # 2.2.0 W1 · A1：版本/身份钉门禁（偏差 exit 2 · D-PINS-EXIT）
