# DEF-018 D1(a)：仓级 CI——本地 prepublishOnly 之外，拦截「不发布但合入」的 src→lib 漂移
name: ci

on:
  push:
  pull_request:

# 2.3-W3 ④（C4 · SPEC 03 §5.4）：顶层最小权限（GITHUB_TOKEN 只读 · job 如需写权限须显式声明并注释理由）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # F-A1-07：防空跑卡死（原缺失 · 2.2.0 W1 补）
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']  # 对齐 package.json engines: ^22.19.0 || >=24.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布溯源测需 git tag v<version>（test/release-tag-identity.test.ts）
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:lib
      - run: node bin/specgate.js pins check  # 2.2.0 W1 · A1：版本/身份钉门禁（偏差 exit 2 · D-PINS-EXIT）
      - run: node bin/specgate.js assets verify  # 2.3.0 W5 · A2：assets sha256 完整性门禁（偏差 exit 2 failClosed · 与 pins 同点位同语义 · 改 assets 未重生成即红 D-23-W5-GEN-CMD）

  # 2.3-W3 ④（C4）：依赖扫描（fail-closed · D-23-W3-AUDIT-GATE —— 现状 js-yaml high 已于本波 npm audit fix 修平）
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - name: Dependency audit (fail on high+)
        run: npm audit --audit-level=high

  # 2.3-W3 ④（C4）：密钥扫描（gitleaks 官方 release 二进制钉版 + --no-git 工作树档 · D-23-W3-GITLEAKS-FORM；
  # 不用 gitleaks-action：避 org 仓 license 依赖与 git 历史扫描不确定性；误报走 .gitleaksignore 数据留痕 F-W3-04）
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (pinned)
        run: |
          GITLEAKS_VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Secret scan (working tree · no git history)
        run: /tmp/gitleaks detect --source . --no-git --redact --exit-code 1
