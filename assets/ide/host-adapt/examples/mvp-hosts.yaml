# Host-adapt 声明式适配表 · 宿主（dsh / cursor / claude / agents / copilot / codex / windsurf / gemini / opencode / roo / zed / cline / aider）
# 2.2 W6：copilot / codex / windsurf 原生读 AGENTS.md · always_on/skills 全量复用 agents 行资产（近零新资产）
#   skills 原生落点：copilot=.github/skills · codex=.agents/skills（官方 repo 级扫描目录）· windsurf=.windsurf/skills
# 2.3 W6：gemini / opencode / roo / zed / cline / aider（B4 · 落点逐宿主官方文档取证 @2026-09-13 · 见末尾六行注释）
# 校验：npx spec-wave host validate [--file PATH]
# 物化：npx spec-wave host apply --tools cursor,claude --profile core|expanded [--dry-run|--yes]
# 刷新：npx spec-wave host update [--tools LIST] [--profile core|expanded] [--dry-run|--yes] [--force]
# schema：../host-adapt.schema.json
# skills 落点矩阵：../README.md
version: "1"
hosts:
  - host_id: dsh
    surfaces:
      always_on: []
      skills:
        # 帽子六条（跳过 30/40）
        - target_dir: .dsh/skills
          from: assets/skills/*
        # 编排五条（B-DSH-ORCH=B · /kit-* skill；上游无 .dsh/commands）
        - target_dir: .dsh/skills
          from: assets/ide/skills-orch/*
      # DSH：slash 发现根 = .dsh/skills；commands 必须空
      commands: []
      verify:
        kind: cli
        bin: spec-wave
        failClosed: true

  - host_id: cursor
    surfaces:
      always_on:
        - target: .cursor/rules/05-kit-starter.mdc
          source: assets/ide/adapters/cursor-harness-starter.mdc.example
      skills:
        - target_dir: .cursor/skills
          from: assets/skills/*
      commands:
        - target_dir: .cursor/commands
          from: assets/ide/commands/cursor/*
          profile: core
        - target_dir: .cursor/commands
          from: assets/ide/commands/cursor/*
          profile: expanded
      verify:
        kind: cli
        bin: spec-wave
        failClosed: true

  - host_id: claude
    surfaces:
      always_on:
        - target: CLAUDE.md
          source: assets/ide/adapters/CLAUDE.md.fragment.example
      skills:
        - target_dir: .claude/skills
          from: assets/skills/*
      commands:
        - target_dir: .claude/commands/kit
          from: assets/ide/commands/claude/kit/*
          profile: core
        - target_dir: .claude/commands/kit
          from: assets/ide/commands/claude/kit/*
          profile: expanded
      verify:
        kind: cli
        bin: spec-wave
        failClosed: true

  - host_id: agents
    surfaces:
      always_on:
        - target: AGENTS.md
          source: assets/ide/adapters/AGENTS.md.fragment.example
      skills:
        - target_dir: .agents/skills
          from: assets/skills/*
      commands: []
      verify:
        kind: cli
        bin: spec-wave
        failClosed: true

