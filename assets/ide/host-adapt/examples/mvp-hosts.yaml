  # 2.3 W6 新增六宿主（B4）：always_on/skills 全量复用 agents 行资产（AGENTS.md 片段 + assets/skills/* · 零新资产 · marker merge 幂等）
  # 落点逐宿主官方文档取证（2026-09-13 · 取证卡见 task_2_3_wiring_w6_host_completion）：
  #   gemini：官方上下文文件=GEMINI.md（AGENTS.md 不在默认 context.fileName · 官方仓 issue #28227）→ always_on 落 GEMINI.md，
  #     复用同一片段资产（内容宿主中立 Harness Starter）；skills 官方自动发现目录=.gemini/skills（gemini-cli 官方 creating-skills 文档）；
  #     commands 官方为 .gemini/commands/*.toml 专属格式 → 本波 []（原生集成归 3.0 A3）
  #   opencode：官方 Rules=AGENTS.md 项目根（opencode.ai/docs/rules/）；skills 官方 agent-compatible 目录=.agents/skills
  #     （opencode.ai/docs/skills/ · 原生 .opencode/skills 并存，选 .agents/skills 复用 agents 资产面）
  #   roo：AGENTS.md 由官方仓 merged PR #10446（2026-01-03）加载；原生约定=.roo/rules/ 目录（docs.roocode.com · 需专属资产本波不建）；
  #     无官方 skills 目录约定 → skills 不物化（不强造目录 · SPEC §5.1）
  #   zed：AGENTS.md 在官方兼容指令文件清单（zed-industries/zed 官方 ai/rules 文档）；skills 官方 project-local 目录=.agents/skills（同仓 ai/skills 文档）
  #   cline：AGENTS.md 官方支持（docs.cline.bot cline-rules 页「Standard format for cross-tool compatibility」）；
  #     skills 官方推荐 workspace 目录=.cline/skills（customization/skills）；原生 .clinerules/ 为替代约定（不建）
  #   aider：**降级（如实标注）**——官方约定=CONVENTIONS.md 显式 --read 或 .aider.conf.yml read: 配置，无 AGENTS.md 自动加载
  #     （aider.chat/docs/usage/conventions.html · issue #4363 open）；落 AGENTS.md 为跨工具注入层价值（同仓 AGENTS.md 系宿主共享），
  #     aider 侧须用户自行 --read AGENTS.md 或配置 read: AGENTS.md；无官方 skills 约定 → 不物化
  - host_id: gemini
    surfaces:
      always_on:
        - target: GEMINI.md
          source: assets/ide/adapters/AGENTS.md.fragment.example
      skills:
        - target_dir: .gemini/skills
          from: assets/skills/*
      commands: []
      verify:
        kind: cli
        bin: spec-wave
        failClosed: true

