# Release pins · 版本/身份钉单一声明源（2.2.0 W1 · A1 · 蓝本 SPEC 01 §5/§6.1 · 2_2-closed-loop-start 夹）
#
# 真值源：package.json#version（pin-01）；其余钉面向它对齐。
# 数据驱动：新增/调整落点只改本文件，不改 TypeScript（PROMPT §4.a · SPEC 01 §4 非范围首条）。
# extract 表达式本身也是数据；expected 关系：self（真值源自身）/ package-version（=package.json#version）/ const / const-map。
# fixable = pins fix 是否可写该落点；S2（docs/tasks · docs/harness/reviews · docs/harness/invokes/by-task）机械拒写 · 无豁免参数。
# 门禁：prepublishOnly 链尾 + CI workflow test job（D-PINS-EXIT：偏差 exit 2）。

version: "1"
truth_source: package.json#version

pins:
  - id: pin-01
    path: package.json
    extract: { kind: json-field, field: version }
    expected: { kind: self }
    required: true
    fixable: false
    note: 唯一真值源（SPEC 01 §5 #1）；其余钉面向它对齐，pins fix 永不反向改
  - id: pin-02
    path: package.json
    extract: { kind: json-field, field: name }
    expected: { kind: const, value: spec-wave }
    required: true
    fixable: false
    note: 包名钉（改名史 SpecGate → SpecWave）；只校验不修复
  - id: pin-03
    path: assets/ontology.yaml
    extract: { kind: regex, pattern: '^product_semver:\s*"([^"]+)"', flags: m }
    expected: { kind: package-version }
    required: true
    fixable: true
  - id: pin-04
    path: assets/harness/discipline-coverage.yaml
    extract: { kind: regex, pattern: '^as_of_package_version:\s*"([^"]+)"', flags: m }
    expected: { kind: package-version }
    required: true
    fixable: true
  - id: pin-05
    path: README.md
    extract: { kind: regex-all, pattern: 'spec-wave@(\d+\.\d+\.\d+)', flags: g }
    expected: { kind: package-version }
    required: true
    fixable: true
    note: 全部出现处均须等于包版本（11 处实测 @2026-09-11）
  - id: pin-06
    path: README.zh-CN.md
    extract: { kind: regex-all, pattern: 'spec-wave@(\d+\.\d+\.\d+)', flags: g }
    expected: { kind: package-version }
    required: true
    fixable: true
    note: 全部出现处均须等于包版本（11 处实测 @2026-09-11）
  - id: pin-07
    path: RELEASING.md
    extract: { kind: regex, pattern: 'registry `latest`\*\* \| \*\*`spec-wave@(\d+\.\d+\.\d+)`', flags: m }
    expected: { kind: package-version }
    required: true
    fixable: true
    note: 仅「工作树 / registry latest」现行包行（:13）；历史行（前一 latest 等）不钉
  - id: pin-08
    path: docs/spec/README.md
    extract:
      kind: spec-index-row
      # D-PINS-SCOPE-8 + D-23-PIN08-STRICT（2.3-W1 严化 · [A]#7）+ D-24-PIN08-SEMCELL（2.4-W1 语义格位锁定 ·
      # 验收报告 §3.J）：提取语义作为数据声明（非硬编码）。
      semantics: >-
        索引表存在当前版本合格行（语义格位口径 · D-24-PIN08-SEMCELL）：(A) 状态列（cells[2] ·
        列序约定 cells[0]=slug / cells[1]=路径 / cells[2]=状态 · F-W1-04 列序变更须钉面同步评审）
        含当前版本点式 X.Y.Z 且 (B) slug 列含版本串或以 X_Y- 前缀开头（minor 主题夹行 ·
        行身份辅助判）；下划线式 X_Y / X_Y_Z 一律不计入版本串（slug/文件名/归档链接顶包排除）；
        行内其他位置（描述列/prose/链接）含版本形态串但状态格无点式串 → 兜底嫌疑行不放行。
        2.4.1 NEW-9（验收报告-SpecWave-2.4.0 §3 + §2 N9 闭环）：状态列命中判据为边界正则
        (?<![0-9A-Za-z._-])X\.Y\.Z(?![0-9A-Za-z._-]) 精确锁定（非裸子串包含）——左/右边界排除
        数字/字母/点/下划线/连字符，拦 `vX.Y.Z` v 前缀 / `X.Y.Z-beta` 修饰 / `X.Y.Z.N` 加长顶包，
        放行反引号/星号/@ 包裹形态（`X.Y.Z` published 等存量行零误伤）。
        「X.Y.Z 规划中」类非发布态行：状态列含点式串即算行身份合格（F-W1-05 定稿 · 发布态
        准确性归 pin-10 tag 闸分工）。X.Y.0 时 minor 主题夹行状态列含 X.Y.0 即满足，patch 时须
        X.Y.Z patch 收尾标注行（D-SPEC-213-ROW：2.1.3/2.2.1/2.3.1 先例 · 不建 X_Y_Z-* 夹）
    expected: { kind: package-version }
    required: true
    fixable: false
    note: 半可写（SPEC 01 §5 #8）：仅可按 D-SPEC-213-ROW 模板人工补行；pins fix 不代写文档叙事行
  - id: pin-09
    path: package.json
    extract: { kind: json-bin }
    expected:
      kind: const-map
      value:
        spec-wave: bin/specgate.js
        specgate: bin/specgate.js
        dsh-coding-kit: bin/dsh-coding-kit.js
    required: true
    fixable: false
    note: bin 三入口钉（沿袭 2.1.2 B-BIN-FILE=拒绝改 bin 文件名）；只校验不修复
  - id: pin-10
    path: git
    extract: { kind: git-tag, pattern: 'v{version}' }
    expected: { kind: package-version }
    required: true
    fixable: false
    note: tag vX.Y.Z 存在性；git 操作仅人（F-A1-05），pins fix 永不动 git
  - id: pin-11
    path: assets/ide/host-adapt/README.md
    extract: { kind: regex-all, pattern: 'spec-wave@(\d+\.\d+\.\d+)', flags: g }
    expected: { kind: package-version }
    required: true
    fixable: true
    note: 2.2 W6 新增宿主相关版本文案落点（host apply/update 示例命令 spec-wave@X.Y.Z · 2 处实测 @2026-09-11）；只动数据不改 pins 代码
  - id: pin-12
    path: assets/ide/host-adapt/README.md
    extract: { kind: regex, pattern: '落点矩阵与 CLI（(\d+\.\d+\.\d+)）', flags: m }
    expected: { kind: package-version }
    required: true
    fixable: true
    note: 2.2 W6 新增宿主相关版本文案落点（host-adapt README 标题版本行 :1）；capture group 1 可修
  - id: pin-13
    path: CHANGELOG.md
    extract: { kind: regex, pattern: '^## \[(\d+\.\d+\.\d+)\]', flags: m }
    expected: { kind: package-version }
    required: true
    fixable: true
    note: >-
      最新发布头（首个非 Unreleased 节 · D-23-PIN-3FACES · 2.3-W1 [A]#8）；
      Unreleased 无数字天然跳过，仅 Unreleased 空节 → 零命中 extract_error failClosed（F-W1-02）；
      capture group 1 回写版本号 · 不动日期行其余
  - id: pin-14
    path: MIGRATION.md
    extract: { kind: regex-all, pattern: 'spec-wave@(\d+\.\d+\.\d+)', flags: g }
    expected: { kind: package-version }
    required: true
    fixable: true
    note: >-
      现行出现处全为现行指引（:3/:4/:7/:85 逐行核对 @2026-09-12）；历史叙事行均为
      dsh-coding-kit@… / @cyning/harness 形态，不被本模式命中（F-W1-03）；
      未来若引入 spec-wave@X.Y.Z 历史叙事形态须先返修本数据口径
  - id: pin-15
    path: AGENTS.md
    extract: { kind: regex-all, pattern: 'npx spec-wave@(\d+\.\d+\.\d+)', flags: g }
    expected: { kind: package-version }
    required: true
    fixable: true
    note: >-
      刷新指引命令钉（现行唯一出现处 :61 · cyning-harness local 块内 · D-23-PIN-3FACES）；
      fix 只替换版本串 capture group，不动产品块/marker 结构（F-W1-04 · 测试断言块标记完整）
  - id: pin-16
    path: package.json
    extract:
      kind: files-whitelist-link
      # D-23-W2-CHECK-FORM（2.3-W2 · [A]#3 GLOSSARY 死链类 · 验收 §7 机制化①）：提取语义作为数据声明。
      semantics: >-
        文档↔files 白名单：扫 files[] 内全部 markdown 的相对链接——inline 形态 +
        reference-definition 形态（`^\s*\[[^\]]+\]:\s*(\S+)` · 图片 ! 前缀同口径 ·
        D-24-PIN16-REFSTYLE · 2.4-W1 · 验收报告 §3.H）+ HTML 锚点形态
        （`<a href="…">` 单/双引号同口径 + 无引号属性值形态（合法 HTML5 · 2.4.2 R-3 ·
        验收报告-SpecWave-2.4.1 §3.3）· 2.4.1 NEW-3 · 验收报告-SpecWave-2.4.0 §3），
        三形态目标走同一归一/判定管线
        （剥 #锚点 与尖括号 · scheme/纯锚点跳过 · 图片链接同口径 · F-W2-01/F-W1-01），
        解析后仓根级（相对路径不含 /）且
        存在的 .md 目标须在白名单内；白名单 = files[]（精确/目录前缀匹配）∪ npm 自动入包
        规则（/^readme(\..+)?$/i · /^licen[cs]e(\..+)?$/i 按 basename ·
        D-23-W2-NPM-AUTOINCLUDE · 00 裁决 Q1A）；docs/ 任意深度出范围
        （D-23-W2-ROOTSCOPE · 00 裁决 Q2 · F-W2-03 全深度预留）；白名单外且不存在的目标本钉不判
        （F-W2-07 · 死链属另一维度）；缺失的 files 条目跳过不判（如未构建的 lib）；
        白名单比较大小写不敏感，命中后再以磁盘存在性二次确认（仓根条目快照 · 同为大小写
        不敏感）为最终判据——双平台语义一致（D-24-W6-N10 · 2.4-W6 · 验收报告 §3.K ·
        F-W6-01 盘上无任何大小写变体不放行 · F-W6-02 同名两变体并存命中其一即放行）
    expected: { kind: const, value: 0-miss（白名单全覆盖） }
    required: true
    fixable: false
    note: >-
      失配 detail 逐条列 引用文件:行号 -> 被引用文件 + 建议（files 加白 or 移除链接）；
      文档/打包面人工修（与 pin-08 半可写同型 · 机制不代写文档）
  - id: pin-17
    path: assets/ide/host-adapt/examples/mvp-hosts.yaml
    extract:
      kind: readme-host-row
      # D-23-W2-CHECK-FORM（2.3-W2 · [A]#4 宿主低估类 · 验收 §7 机制化②）：语义/映射/豁免全入数据。
      semantics: >-
        宿主↔根 README 表：适配表每个 host_id 的命中形态（host_hits）须在 readmes 双语
        双双命中；命中 = 词锚 ∧ 表行双命中——存在表格行（`^\s*\|` 宽松起首 · F-W1-02）使
        该 host 至少一 pattern 命中该行，tagline/prose 裸词命中不计入
        （D-24-PIN17-TABLEROW · 2.4-W1 · 验收报告 §3.I）；命中形态带表格行/词锚防误命中
        （F-W2-04）；新宿主仅改 tagline 未补表行 → exit 2 点名缺表行（F-W1-03 failClosed）；
        适配表 host 无映射数据 → failClosed 数据债（F-W2-06 · W6 新宿主落地即受约束）；
        known_gaps 过渡豁免（D-23-W2-W7-EXEMPTION · until_wave 截止）——豁免宿主双语
        双双命中（W7① 落地）或已不在适配表 → 豁免失陈债 exit 2（F-W2-05 机检自执行 ·
        豁免移除由 W7 task 关账强制）
      readmes: [README.md, README.zh-CN.md]
      # F-W2-04 逐宿主核对 @2026-09-12：四存量宿主取双语表行锚（README.md:26-29 /
      # README.zh-CN.md:26-29 实测命中 · 普通单词误伤免疫）；三新宿主取官方名词锚。
      # 2.3-W6 六宿主词锚逐核对 @2026-09-13（D-23-W6-ANCHOR · 大小写敏感 · 双语 0 命中实测）：
      # roo 用 'Roo Code'（裸 Roo 误伤 projectRoot）· zed 用大写（小写误伤 materialized）。
      host_hits:
        dsh: ['\|\s*\*\*DSH\*\*']
        cursor: ['\|\s*\*\*Cursor\*\*']
        claude: ['\|\s*\*\*Claude Code\*\*']
        agents: ['\|\s*\*\*agents\*\*']
        copilot: ['Copilot']
        codex: ['Codex']
        windsurf: ['Windsurf']
        gemini: ['Gemini']
        opencode: ['opencode']
        roo: ['Roo Code']
        zed: ['Zed']
        cline: ['Cline']
        aider: ['aider']
      # D-23-W2-W7-EXEMPTION（2026-09-14 · 2.3-W7① 已关账）：过渡豁免机制保留（until_wave 截止 +
      # 失陈债机检自执行：豁免宿主双语双双命中即 exit 2 报债）；历史九条 = 三旧（2.3-W2 ·
      # copilot/codex/windsurf）+ 六新（2.3-W6 · SPEC 06 §5.3 过渡口径）已随根 README 双语 13 行
      # 落地全部摘除（中间态失陈债 exit 2 实证见 task_2_3_wiring_w7_dx_health 自检结论）。
      # known_gaps 现为空；未来新宿主过渡仍可挂条目（四字段 host_id/since_wave/until_wave/note）。
      known_gaps: []
    expected: { kind: const, value: 0-miss（宿主双语命中 · 豁免除外且无失陈） }
    required: true
    fixable: false
    note: >-
      失配按 EN/ZH 分侧报告（host_id · 缺 README.md(EN)/README.zh-CN.md(ZH)）；
      文档面（根 README 宿主表行）人工修 · W7① 职责，本波只建机制
